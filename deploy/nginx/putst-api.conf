# anonymous identity: auth_request mints/validates the put_uid cookie and signs x-user-id for the API
location = /_put_auth {
    internal;
    proxy_pass http://127.0.0.1:8788/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location /api/ {
    auth_request /_put_auth;
    auth_request_set $put_uid $upstream_http_x_user_id;
    auth_request_set $put_sig $upstream_http_x_user_signature;
    auth_request_set $put_cookie $upstream_http_set_cookie;
    add_header Set-Cookie $put_cookie always;

    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-User-Id $put_uid;
    proxy_set_header X-User-Signature $put_sig;
    proxy_read_timeout 30s;
    client_max_body_size 300k;
}
